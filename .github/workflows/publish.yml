          publish_one "1.15" "forge"
          publish_one "1.15.1" "forge"
          publish_one "1.15.2" "forge"
          publish_one "1.16.1" "forge"
          publish_one "1.16.2" "forge"
          publish_one "1.16.3" "forge"
          publish_one "1.16.4" "forge"
          publish_one "1.16.5" "forge"
          publish_one "1.17.1" "forge"
          publish_one "1.18" "forge"
          publish_one "1.18.1" "forge"
          publish_one "1.18.2" "forge"
          publish_one "1.19" "forge"
          publish_one "1.19.1" "forge"
          publish_one "1.19.2" "forge"
          publish_one "1.19.3" "forge"
          publish_one "1.19.4" "forge"
          publish_one "1.20" "forge"
          publish_one "1.20.1" "forge"
          publish_one "1.20.2" "forge"
          publish_one "1.20.3" "forge"
          publish_one "1.20.4" "forge"
          publish_one "1.20.6" "forge"
          publish_one "1.21" "forge"
          publish_one "1.21.1" "forge"
          publish_one "1.21.3" "forge"
          publish_one "1.21.4" "forge"
          publish_one "1.21.5" "forge"
          publish_one "1.21.6" "forge"
          publish_one "1.21.7" "forge"
          publish_one "1.21.8" "forge"
          publish_one "1.21.9" "forge"
          publish_one "1.21.10" "forge"
          publish_one "1.21.11" "forge"

          echo "Updating project-level environment metadata..."
          PROJ_RESP=$(curl -s -w "\nHTTP_STATUS:%{http_code}" \
            -X PATCH "https://api.modrinth.com/v2/project/r45R0pFr" \
            -H "Authorization: $MODRINTH_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"client_side": "required", "server_side": "unsupported", "requested_status": "listed"}')
          PROJ_STATUS=$(echo "$PROJ_RESP" | grep 'HTTP_STATUS:' | cut -d: -f2)
          PROJ_BODY=$(echo "$PROJ_RESP" | grep -v 'HTTP_STATUS:')
          echo "[project] HTTP $PROJ_STATUS: $PROJ_BODY"
