name: Publish to Modrinth

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - branch: mc/1.21.4
            mc_version: 1.21.4
          - branch: mc/1.21.1
            mc_version: 1.21.1
          - branch: mc/1.20.4
            mc_version: 1.20.4

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.branch }}

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Build
        run: chmod +x gradlew && ./gradlew remapJar

      - name: Prepare JAR
        run: |
          MOD_VERSION=$(grep '^mod_version=' gradle.properties | cut -d= -f2)
          cp build/libs/minewordle-${MOD_VERSION}.jar minewordle-${{ matrix.mc_version }}.jar

      - uses: actions/upload-artifact@v4
        with:
          name: jar-${{ matrix.mc_version }}
          path: minewordle-${{ matrix.mc_version }}.jar

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: jar-*
          merge-multiple: true
          path: jars/

      - name: Get mod version
        run: echo "MOD_VERSION=$(grep '^mod_version=' gradle.properties | cut -d= -f2)" >> $GITHUB_ENV

      - name: Delete existing Modrinth versions
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
        run: |
          VERSIONS_JSON=$(curl -s "https://api.modrinth.com/v2/project/r45R0pFr/version" \
            -H "Authorization: $MODRINTH_TOKEN")
          for VERSION_ID in $(echo "$VERSIONS_JSON" | jq -r --arg ver "$MOD_VERSION" '.[] | select(.version_number == $ver) | .id'); do
            echo "Deleting version $VERSION_ID ($MOD_VERSION)"
            curl -s -X DELETE "https://api.modrinth.com/v2/version/$VERSION_ID" \
              -H "Authorization: $MODRINTH_TOKEN"
          done

      - name: Publish to Modrinth
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
        run: |
          cat > data.json << 'EOF'
          {
            "name": "MineWordle VERSION_PLACEHOLDER",
            "version_number": "VERSION_PLACEHOLDER",
            "project_id": "r45R0pFr",
            "version_type": "release",
            "featured": true,
            "game_versions": ["1.21.11", "1.21.4", "1.21.1", "1.20.4"],
            "loaders": ["fabric"],
            "client_side": "required",
            "server_side": "unsupported",
            "file_parts": ["file-0", "file-1", "file-2"],
            "primary_file": "file-0",
            "dependencies": [{"project_id": "P7dR8mSH", "dependency_type": "required"}],
            "changelog": ""
          }
          EOF
          sed -i "s/VERSION_PLACEHOLDER/$MOD_VERSION/g" data.json

          curl -sf -X POST "https://api.modrinth.com/v2/version" \
            -H "Authorization: $MODRINTH_TOKEN" \
            -F "data=@data.json;type=application/json" \
            -F "file-0=@jars/minewordle-1.21.4.jar;type=application/java-archive" \
            -F "file-1=@jars/minewordle-1.21.1.jar;type=application/java-archive" \
            -F "file-2=@jars/minewordle-1.20.4.jar;type=application/java-archive"
