name: Publish to Modrinth

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - branch: mc/1.20
            mc_version: 1.20
          - branch: mc/1.20.1
            mc_version: 1.20.1
          - branch: mc/1.20.2
            mc_version: 1.20.2
          - branch: mc/1.20.3
            mc_version: 1.20.3
          - branch: mc/1.20.4
            mc_version: 1.20.4
          - branch: mc/1.20.5
            mc_version: 1.20.5
          - branch: mc/1.20.6
            mc_version: 1.20.6
          - branch: mc/1.21
            mc_version: 1.21
          - branch: mc/1.21.1
            mc_version: 1.21.1
          - branch: mc/1.21.2
            mc_version: 1.21.2
          - branch: mc/1.21.3
            mc_version: 1.21.3
          - branch: mc/1.21.4
            mc_version: 1.21.4
          - branch: mc/1.21.5
            mc_version: 1.21.5
          - branch: mc/1.21.6
            mc_version: 1.21.6
          - branch: mc/1.21.7
            mc_version: 1.21.7
          - branch: mc/1.21.8
            mc_version: 1.21.8
          - branch: mc/1.21.9
            mc_version: 1.21.9
          - branch: mc/1.21.10
            mc_version: 1.21.10
          - branch: mc/1.21.11
            mc_version: 1.21.11
          - branch: mc/26.1
            mc_version: 26.1
            java: '25'
            build_task: jar
          - branch: mc/26.1.1
            mc_version: 26.1.1
            java: '25'
            build_task: jar
          - branch: mc/26.1.2
            mc_version: 26.1.2
            java: '25'
            build_task: jar

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.branch }}

      - uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java || '21' }}
          distribution: 'temurin'
          cache: gradle

      - name: Build
        run: chmod +x gradlew && ./gradlew ${{ matrix.build_task || 'remapJar' }}

      - name: Prepare JAR
        run: |
          MOD_VERSION=$(grep '^mod_version=' gradle.properties | cut -d= -f2)
          cp build/libs/minewordle-${MOD_VERSION}.jar minewordle-${{ matrix.mc_version }}.jar

      - uses: actions/upload-artifact@v4
        with:
          name: jar-${{ matrix.mc_version }}
          path: minewordle-${{ matrix.mc_version }}.jar

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: jar-*
          merge-multiple: true
          path: jars/

      - name: Get mod version
        run: echo "MOD_VERSION=$(grep '^mod_version=' gradle.properties | cut -d= -f2)" >> $GITHUB_ENV

      - name: Delete existing matching Modrinth versions
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
        run: |
          VERSIONS_JSON=$(curl -s "https://api.modrinth.com/v2/project/r45R0pFr/version" \
            -H "Authorization: $MODRINTH_TOKEN")
          for VERSION_ID in $(echo "$VERSIONS_JSON" | jq -r --arg ver "$MOD_VERSION" '.[] | select(.version_number == $ver or (.version_number | startswith($ver + "+"))) | .id'); do
            echo "Deleting existing version $VERSION_ID"
            curl -s -X DELETE "https://api.modrinth.com/v2/version/$VERSION_ID" \
              -H "Authorization: $MODRINTH_TOKEN"
          done

      - name: Publish to Modrinth
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
        run: |
          publish_one() {
            local mc_version="$1"
            local jar_file="jars/minewordle-${mc_version}.jar"
            local upload_name="minewordle-${MOD_VERSION}+${mc_version}.jar"
            local version_number="${MOD_VERSION}+${mc_version}"

            jq -n \
              --arg name "MineWordle ${MOD_VERSION}" \
              --arg version_number "$version_number" \
              --arg mc_version "$mc_version" \
              '{
                name: $name,
                version_number: $version_number,
                project_id: "r45R0pFr",
                version_type: "release",
                featured: true,
                game_versions: [$mc_version],
                loaders: ["fabric"],
                client_side: "required",
                server_side: "unsupported",
                file_parts: ["file-0"],
                primary_file: "file-0",
                dependencies: [{project_id: "P7dR8mSH", dependency_type: "required"}],
                changelog: ""
              }' > data.json

            echo "Uploading ${version_number}..."
            RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}" -X POST "https://api.modrinth.com/v2/version" \
              -H "Authorization: $MODRINTH_TOKEN" \
              -F "data=@data.json;type=application/json" \
              -F "file-0=@${jar_file};filename=${upload_name};type=application/java-archive")

            HTTP_STATUS=$(echo "$RESPONSE" | grep 'HTTP_STATUS:' | cut -d: -f2)
            BODY=$(echo "$RESPONSE" | grep -v 'HTTP_STATUS:')
            echo "[${version_number}] HTTP $HTTP_STATUS: $BODY"

            if [ "$HTTP_STATUS" -lt 200 ] || [ "$HTTP_STATUS" -ge 300 ]; then
              echo "ERROR: Modrinth API returned $HTTP_STATUS for ${version_number}"
              exit 1
            fi

            VERSION_ID=$(echo "$BODY" | jq -r '.id // empty')
            if [ -n "$VERSION_ID" ]; then
              ENV_RESP=$(curl -s -w "\nHTTP_STATUS:%{http_code}" \
                -X PATCH "https://api.modrinth.com/v3/version/$VERSION_ID" \
                -H "Authorization: $MODRINTH_TOKEN" \
                -H "Content-Type: application/json" \
                -d '{"environment": "client_only"}')
              ENV_STATUS=$(echo "$ENV_RESP" | grep 'HTTP_STATUS:' | cut -d: -f2)
              echo "[env v3] HTTP $ENV_STATUS"
            fi
          }

          publish_one "1.20"
          publish_one "1.20.1"
          publish_one "1.20.2"
          publish_one "1.20.3"
          publish_one "1.20.4"
          publish_one "1.20.5"
          publish_one "1.20.6"
          publish_one "1.21"
          publish_one "1.21.1"
          publish_one "1.21.2"
          publish_one "1.21.3"
          publish_one "1.21.4"
          publish_one "1.21.5"
          publish_one "1.21.6"
          publish_one "1.21.7"
          publish_one "1.21.8"
          publish_one "1.21.9"
          publish_one "1.21.10"
          publish_one "1.21.11"
          publish_one "26.1"
          publish_one "26.1.1"
          publish_one "26.1.2"

          echo "Updating project-level environment metadata..."
          PROJ_RESP=$(curl -s -w "\nHTTP_STATUS:%{http_code}" \
            -X PATCH "https://api.modrinth.com/v2/project/r45R0pFr" \
            -H "Authorization: $MODRINTH_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"client_side": "required", "server_side": "unsupported", "requested_status": "listed"}')
          PROJ_STATUS=$(echo "$PROJ_RESP" | grep 'HTTP_STATUS:' | cut -d: -f2)
          PROJ_BODY=$(echo "$PROJ_RESP" | grep -v 'HTTP_STATUS:')
          echo "[project] HTTP $PROJ_STATUS: $PROJ_BODY"
