    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.branch }}

      - uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java || '21' }}
          distribution: 'temurin'
          cache: gradle

      - name: Build
        run: chmod +x gradlew && ./gradlew ${{ matrix.build_task || 'remapJar' }} --stacktrace

      - name: Prepare JAR
        run: |
          MOD_VERSION=$(grep '^mod_version=' gradle.properties | cut -d= -f2)
          TAG="${{ matrix.loader && format('{0}-{1}', matrix.loader, matrix.mc_version) || matrix.mc_version }}"
          cp build/libs/minewordle-${MOD_VERSION}.jar minewordle-${TAG}.jar

      - uses: actions/upload-artifact@v4
        with:
          name: jar-${{ matrix.loader && format('{0}-{1}', matrix.loader, matrix.mc_version) || matrix.mc_version }}
          path: minewordle-${{ matrix.loader && format('{0}-{1}', matrix.loader, matrix.mc_version) || matrix.mc_version }}.jar

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: jar-*
          merge-multiple: true
          path: jars/

      - name: Get mod version
        run: echo "MOD_VERSION=$(grep '^mod_version=' gradle.properties | cut -d= -f2)" >> $GITHUB_ENV

      - name: Delete existing matching Modrinth versions
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
        run: |
          VERSIONS_JSON=$(curl -s "https://api.modrinth.com/v2/project/r45R0pFr/version" \
            -H "Authorization: $MODRINTH_TOKEN")
          for VERSION_ID in $(echo "$VERSIONS_JSON" | jq -r --arg ver "$MOD_VERSION" '.[] | select(.version_number == $ver or (.version_number | startswith($ver + "+"))) | .id'); do
            echo "Deleting existing version $VERSION_ID"
            curl -s -X DELETE "https://api.modrinth.com/v2/version/$VERSION_ID" \
              -H "Authorization: $MODRINTH_TOKEN"
          done

      - name: Publish to Modrinth
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
        run: |
          publish_one() {
            local mc_version="$1"
            local loader="${2:-fabric}"
            local tag="$mc_version"
            local deps='[{"project_id": "P7dR8mSH", "dependency_type": "required"}]'
            if [ "$loader" != "fabric" ]; then
              tag="${loader}-${mc_version}"
              deps='[]'
            fi
            local jar_file="jars/minewordle-${tag}.jar"
            local upload_name="minewordle-${MOD_VERSION}+${tag}.jar"
            local version_number="${MOD_VERSION}+${tag}"

            jq -n \
              --arg name "MineWordle ${MOD_VERSION} (${loader})" \
              --arg version_number "$version_number" \
              --arg mc_version "$mc_version" \
              --arg loader "$loader" \
              --argjson dependencies "$deps" \
              '{
                name: $name,
                version_number: $version_number,
                project_id: "r45R0pFr",
                version_type: "release",
                featured: true,
                game_versions: [$mc_version],
                loaders: [$loader],
                client_side: "required",
                server_side: "unsupported",
                file_parts: ["file-0"],
                primary_file: "file-0",
                dependencies: $dependencies,
                changelog: ""
              }' > data.json

            echo "Uploading ${version_number}..."
            RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}" -X POST "https://api.modrinth.com/v2/version" \
              -H "Authorization: $MODRINTH_TOKEN" \
              -F "data=@data.json;type=application/json" \
              -F "file-0=@${jar_file};filename=${upload_name};type=application/java-archive")

            HTTP_STATUS=$(echo "$RESPONSE" | grep 'HTTP_STATUS:' | cut -d: -f2)
            BODY=$(echo "$RESPONSE" | grep -v 'HTTP_STATUS:')
            echo "[${version_number}] HTTP $HTTP_STATUS: $BODY"

            if [ "$HTTP_STATUS" -lt 200 ] || [ "$HTTP_STATUS" -ge 300 ]; then
              echo "ERROR: Modrinth API returned $HTTP_STATUS for ${version_number}"
              exit 1
            fi

            VERSION_ID=$(echo "$BODY" | jq -r '.id // empty')
            if [ -n "$VERSION_ID" ]; then
              ENV_RESP=$(curl -s -w "\nHTTP_STATUS:%{http_code}" \
                -X PATCH "https://api.modrinth.com/v3/version/$VERSION_ID" \
                -H "Authorization: $MODRINTH_TOKEN" \
                -H "Content-Type: application/json" \
                -d '{"environment": "client_only"}')
              ENV_STATUS=$(echo "$ENV_RESP" | grep 'HTTP_STATUS:' | cut -d: -f2)
              echo "[env v3] HTTP $ENV_STATUS"
            fi
          }

          publish_one "1.14.3"
          publish_one "1.14.4"
          publish_one "1.15"
          publish_one "1.15.1"
          publish_one "1.15.2"
          publish_one "1.16"
